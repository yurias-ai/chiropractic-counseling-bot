<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>練習お客様AI — カイロプラクティック初回問診トレーナー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235b8def'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white'%3E🩺%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --border: #e3e8f0;
    --text: #1a2332;
    --text-sub: #6b7280;
    --primary: #5b8def;
    --primary-dark: #4070d6;
    --primary-soft: #e8efff;
    --accent: #34c4a8;
    --warn: #f59e0b;
    --shadow: 0 1px 3px rgba(20, 30, 60, 0.06), 0 4px 16px rgba(20, 30, 60, 0.06);
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.6;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  /* Header */
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: grid;
    place-items: center;
    color: white;
    font-size: 22px;
  }
  header .titles { flex: 1; min-width: 0; }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  header .status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f1f5f9;
    color: var(--text-sub);
    white-space: nowrap;
  }
  header .status.active {
    background: #e8f8f3;
    color: #128a6e;
  }

  /* Chat area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  /* Welcome screen */
  .welcome {
    text-align: center;
    padding: 32px 20px 8px;
    color: var(--text);
  }
  .welcome .hero {
    font-size: 56px;
    margin-bottom: 8px;
  }
  .welcome h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
  }
  .welcome p {
    margin: 0 auto 20px;
    color: var(--text-sub);
    font-size: 14px;
    max-width: 480px;
    text-align: left;
  }
  .welcome ol {
    text-align: left;
    max-width: 480px;
    margin: 0 auto 24px;
    padding-left: 22px;
    color: var(--text-sub);
    font-size: 14px;
  }
  .welcome ol li { margin-bottom: 6px; }

  .start-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(91, 141, 239, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .start-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(91, 141, 239, 0.45);
  }
  .start-cta:active { transform: translateY(0); }

  /* Bubbles */
  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.25s ease-out;
  }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
  }
  .avatar.patient { background: linear-gradient(135deg, #f9a8d4, #ec4899); }
  .avatar.user { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .row.patient .bubble {
    background: #f1f5f9;
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
  }

  /* Scoring card */
  .scoring {
    background: linear-gradient(180deg, #fff7ed 0%, #fef3c7 100%);
    border: 1px solid #fde68a;
    border-radius: var(--radius);
    padding: 18px 20px;
    margin: 6px 0;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    box-shadow: var(--shadow);
    animation: fadeUp 0.3s ease-out;
  }
  .scoring .label {
    display: inline-block;
    font-size: 11px;
    background: var(--warn);
    color: white;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  /* Typing indicator */
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 11px 16px;
    background: #f1f5f9;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #94a3b8;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Input area */
  .composer {
    border-top: 1px solid var(--border);
    padding: 12px 14px 14px;
    background: var(--surface);
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
  }
  .chip:hover:not(:disabled) {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary-dark);
  }
  .chip.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .chip.primary:hover:not(:disabled) {
    background: var(--primary-dark);
  }
  .chip:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 140px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    background: #f8fafc;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
  }
  textarea:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: white;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 18px;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) {
    background: var(--primary-dark);
    transform: scale(1.05);
  }
  .send-btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .app { box-shadow: none; }
    header { padding: 12px 14px; }
    header h1 { font-size: 15px; }
    .bubble { max-width: 82%; font-size: 14px; }
    .welcome .hero { font-size: 48px; }
    .welcome h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🩺</div>
    <div class="titles">
      <h1>練習お客様AI</h1>
      <div class="subtitle">カイロプラクティック初回問診トレーナー</div>
    </div>
    <div class="status" id="status">待機中</div>
  </header>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="hero">🩺</div>
      <h2>初回カウンセリングの練習を始めましょう</h2>
      <p>本物の患者さんと向き合う前に、AI患者「田中美咲さん」を相手に、何度でも問診の練習ができます。会話の後は5項目で採点フィードバックが届きます。</p>
      <ol>
        <li>「練習開始」を押すと、田中さんが来院します</li>
        <li>10分ほど自然な問診を行ってください</li>
        <li>「採点して」で5項目×10点満点の評価を受け取ります</li>
      </ol>
      <button class="start-cta" id="welcome-start">▶ 練習を開始する</button>
    </div>
  </div>

  <div class="composer">
    <div class="actions">
      <button class="chip primary" id="btn-start">▶ 練習開始</button>
      <button class="chip" id="btn-score" disabled>📝 採点して</button>
      <button class="chip" id="btn-reset" disabled>🔄 リセット</button>
    </div>
    <div class="input-row">
      <textarea id="input" placeholder="まず「練習開始」を押してください" disabled rows="1"></textarea>
      <button class="send-btn" id="btn-send" disabled aria-label="送信">➤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = {
  start:   '/api/practice/start',
  message: '/api/practice/message',
  score:   '/api/practice/score',
  reset:   '/api/practice/reset',
};

const SESSION_KEY = 'chiro_session_id';

const el = {
  chat:        document.getElementById('chat'),
  welcome:     document.getElementById('welcome'),
  status:      document.getElementById('status'),
  input:       document.getElementById('input'),
  btnStart:    document.getElementById('btn-start'),
  btnScore:    document.getElementById('btn-score'),
  btnReset:    document.getElementById('btn-reset'),
  btnSend:     document.getElementById('btn-send'),
  welcomeStart:document.getElementById('welcome-start'),
  toast:       document.getElementById('toast'),
};

let state = 'idle'; // idle | practicing | scoring
let sessionId = localStorage.getItem(SESSION_KEY) || null;
let userTurns = 0;

// ─────────── helpers ───────────
function setState(s) {
  state = s;
  if (s === 'practicing') {
    el.status.textContent = '練習中';
    el.status.classList.add('active');
    el.input.disabled = false;
    el.input.placeholder = '田中さんへの質問を入力...';
    el.btnSend.disabled = false;
    el.btnScore.disabled = userTurns < 1;
    el.btnReset.disabled = false;
    el.btnStart.textContent = '▶ 最初からやり直す';
  } else {
    el.status.textContent = '待機中';
    el.status.classList.remove('active');
    el.input.disabled = true;
    el.input.placeholder = 'まず「練習開始」を押してください';
    el.btnSend.disabled = true;
    el.btnScore.disabled = true;
    el.btnReset.disabled = true;
    el.btnStart.textContent = '▶ 練習開始';
  }
}

function hideWelcome() {
  if (el.welcome) {
    el.welcome.remove();
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    el.chat.scrollTop = el.chat.scrollHeight;
  });
}

function addBubble(role, text) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'patient' ? '美' : '先';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(avatar);
  row.appendChild(bubble);
  el.chat.appendChild(row);
  scrollToBottom();
  return row;
}

function addScoring(text) {
  const card = document.createElement('div');
  card.className = 'scoring';
  card.innerHTML = '<span class="label">📋 採点フィードバック</span>';
  const body = document.createElement('div');
  body.textContent = text;
  card.appendChild(body);
  el.chat.appendChild(card);
  scrollToBottom();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row patient';
  row.id = 'typing-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar patient';
  avatar.textContent = '美';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(avatar);
  row.appendChild(typing);
  el.chat.appendChild(row);
  scrollToBottom();
}

function hideTyping() {
  const row = document.getElementById('typing-row');
  if (row) row.remove();
}

function showToast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  setTimeout(() => el.toast.classList.remove('show'), 2400);
}

async function api(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.detail || `エラー (${res.status})`);
  }
  return res.json();
}

// ─────────── actions ───────────
async function startPractice() {
  hideWelcome();
  // 既存セッションがあっても新規開始（リセット相当）
  el.chat.querySelectorAll('.row, .scoring').forEach(n => n.remove());
  userTurns = 0;
  el.btnStart.disabled = true;
  showTyping();
  try {
    const data = await api(API.start, { session_id: sessionId });
    sessionId = data.session_id;
    localStorage.setItem(SESSION_KEY, sessionId);
    hideTyping();
    addBubble('patient', data.greeting);
    setState('practicing');
  } catch (e) {
    hideTyping();
    showToast(e.message);
    setState('idle');
  } finally {
    el.btnStart.disabled = false;
  }
}

async function sendMessage() {
  const text = el.input.value.trim();
  if (!text || state !== 'practicing') return;
  el.input.value = '';
  autosize();
  addBubble('user', text);
  userTurns += 1;
  el.btnScore.disabled = false;
  el.input.disabled = true;
  el.btnSend.disabled = true;
  showTyping();
  try {
    const data = await api(API.message, { session_id: sessionId, text });
    hideTyping();
    addBubble('patient', data.reply);
  } catch (e) {
    hideTyping();
    showToast(e.message);
  } finally {
    if (state === 'practicing') {
      el.input.disabled = false;
      el.btnSend.disabled = false;
      el.input.focus();
    }
  }
}

async function scorePractice() {
  if (userTurns < 1) {
    showToast('まだ採点する会話がありません');
    return;
  }
  el.btnScore.disabled = true;
  el.btnReset.disabled = true;
  el.input.disabled = true;
  el.btnSend.disabled = true;
  showTyping();
  try {
    const data = await api(API.score, { session_id: sessionId });
    hideTyping();
    addScoring(data.scoring);
    setState('idle');
    // セッションは採点後にサーバ側でリセット済み
    localStorage.removeItem(SESSION_KEY);
    sessionId = null;
  } catch (e) {
    hideTyping();
    showToast(e.message);
    setState('practicing');
  }
}

async function resetPractice() {
  if (!confirm('練習をリセットしますか？')) return;
  try {
    if (sessionId) await api(API.reset, { session_id: sessionId });
  } catch (_) { /* ignore */ }
  localStorage.removeItem(SESSION_KEY);
  sessionId = null;
  el.chat.querySelectorAll('.row, .scoring').forEach(n => n.remove());
  userTurns = 0;
  setState('idle');
  showToast('リセットしました');
}

function autosize() {
  el.input.style.height = 'auto';
  el.input.style.height = Math.min(el.input.scrollHeight, 140) + 'px';
}

// ─────────── wire up ───────────
el.btnStart.addEventListener('click', startPractice);
el.welcomeStart.addEventListener('click', startPractice);
el.btnScore.addEventListener('click', scorePractice);
el.btnReset.addEventListener('click', resetPractice);
el.btnSend.addEventListener('click', sendMessage);

el.input.addEventListener('input', autosize);
el.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

setState('idle');
</script>
</body>
</html>
